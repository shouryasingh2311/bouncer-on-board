name: BOB CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Run BOB Doctor Diagnostics
        run: |
          bob doctor

      - name: Run BOB Pre-Deploy Security Gate
        run: |
          bob scan src --no-ai --out-dir .bob
