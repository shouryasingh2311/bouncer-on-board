<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10192e" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e2d" />
      <stop offset="100%" stop-color="#09141f" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Container Outline -->
  <rect x="2" y="2" width="956" height="326" rx="14" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="2" width="4" height="20" rx="2" fill="url(#cyanLine)" />
    <text x="14" y="17" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="0.3">BOB DUAL-BOUNDARY SECURITY ARCHITECTURE</text>
    <text x="14" y="35" fill="#64748b" font-size="11.5">Two defense checkpoints ensuring malicious code is stopped before execution and before deployment</text>
  </g>

  <!-- Left: Source Agent Box -->
  <g transform="translate(32, 85)">
    <rect x="0" y="0" width="170" height="215" rx="10" fill="url(#boxGrad1)" stroke="#334155" stroke-width="1" />
    <!-- Terminal Icon -->
    <rect x="20" y="22" width="36" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="28" y="45" fill="#38bdf8" font-size="16" font-family="monospace">&gt;_</text>
    <text x="20" y="80" fill="#f1f5f9" font-size="13.5" font-weight="700">Autonomous</text>
    <text x="20" y="98" fill="#f1f5f9" font-size="13.5" font-weight="700">Coding Agent</text>
    <text x="20" y="122" fill="#94a3b8" font-size="11">Claude Code</text>
    <text x="20" y="138" fill="#94a3b8" font-size="11">Antigravity</text>
    <text x="20" y="154" fill="#94a3b8" font-size="11">Cursor / VS Code</text>
    <text x="20" y="186" fill="#64748b" font-size="10.5">Terminal &amp; Tool Calls</text>
  </g>

  <!-- Path Lines (Connecting Left to Right) -->
  <path d="M 202 140 H 250 V 135 H 260" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,3" />
  <path d="M 202 245 H 250 V 250 H 260" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" />

  <!-- Right Top Card: Path 1 bob intercept -->
  <g transform="translate(260, 85)">
    <rect x="0" y="0" width="668" height="98" rx="10" fill="url(#boxGrad2)" stroke="#0284c7" stroke-width="1.2" />
    
    <!-- Path 1 Badge -->
    <rect x="18" y="14" width="135" height="22" rx="4" fill="#0369a1" />
    <text x="85" y="29" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">PATH 1: INTERCEPT</text>

    <!-- Latency Badge -->
    <rect x="160" y="14" width="95" height="22" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="0.8" />
    <text x="207" y="29" fill="#38bdf8" font-size="10.5" font-weight="600" text-anchor="middle">LATENCY &lt; 400ms</text>

    <!-- Main Title & Desc -->
    <text x="18" y="55" fill="#f8fafc" font-size="13" font-weight="700">Pre-Execution Interception Gate (`bob intercept`)</text>
    <text x="18" y="73" fill="#94a3b8" font-size="11">Synchronous hook inspecting package age, typosquat distance, archive AST, and sensitive paths (.env, .ssh).</text>

    <!-- Outcome Pill -->
    <g transform="translate(525, 32)">
      <rect x="0" y="0" width="125" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="62" y="15" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">ALLOW (Exit 0)</text>
      <text x="62" y="28" fill="#ef4444" font-size="10" font-weight="700" text-anchor="middle">BLOCK (Exit 2)</text>
    </g>
  </g>

  <!-- Right Bottom Card: Path 2 bob scan -->
  <g transform="translate(260, 200)">
    <rect x="0" y="0" width="668" height="100" rx="10" fill="url(#boxGrad1)" stroke="#059669" stroke-width="1.2" />
    
    <!-- Path 2 Badge -->
    <rect x="18" y="14" width="115" height="22" rx="4" fill="#047857" />
    <text x="75" y="29" fill="#ecfdf5" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">PATH 2: SCAN</text>

    <!-- AI Badge -->
    <rect x="140" y="14" width="125" height="22" rx="4" fill="#0f172a" stroke="#059669" stroke-width="0.8" />
    <text x="202" y="29" fill="#34d399" font-size="10.5" font-weight="600" text-anchor="middle">IDE-NATIVE / ZERO-TOKEN</text>

    <!-- Main Title & Desc -->
    <text x="18" y="55" fill="#f8fafc" font-size="13" font-weight="700">Pre-Deploy Security Gate (`bob scan`)</text>
    <text x="18" y="73" fill="#94a3b8" font-size="11">Parallel tripwires (Gitleaks, Semgrep, OSV, AST) with AI triage for plain-English explanations and fix diffs.</text>

    <!-- Outcome Pill -->
    <g transform="translate(525, 32)">
      <rect x="0" y="0" width="125" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="62" y="15" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">SARIF REPORT</text>
      <text x="62" y="28" fill="#94a3b8" font-size="9.5" text-anchor="middle">AI Chat Triage</text>
    </g>
  </g>
</svg>
